<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Link Checker</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #999; margin-top: 0; font-size: 0.9rem; }
  textarea { width: 100%; height: 140px; background: #1c1c1c; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 10px; font-size: 0.95rem; box-sizing: border-box; }
  button { margin-top: 10px; background: #2d6cdf; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
  button:hover { background: #2559b8; }
  button:disabled { background: #444; cursor: default; }
  #detected { font-size: 0.85rem; color: #999; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #333; }
  .blocked { color: #ff5c5c; font-weight: 600; }
  .allowed { color: #5cff8a; font-weight: 600; }
  .error { color: #999; font-style: italic; }
  .broken { color: #ffb347; font-weight: 600; }
  .working { color: #5cff8a; }
</style>
</head>
<body>

<h1>Link Checker</h1>
<p class="sub">Paste links in below — every domain gets auto-detected and checked against Fortiguard and Linewize.</p>

<textarea id="input" placeholder="Paste URLs here, one or many per line..."></textarea>
<div id="detected"></div>
<button id="sendBtn">Send</button>
<label style="margin-left: 14px; font-size: 0.9rem; color: #ccc; user-select: none;">
  <input type="checkbox" id="hideBlocked"> Hide blocked links
</label>
<label style="margin-left: 14px; font-size: 0.9rem; color: #ccc; user-select: none;">
  <input type="checkbox" id="hideBroken" checked> Hide broken links
</label>
<div id="summary" style="font-size:0.85rem;color:#999;margin-top:8px;"></div>

<table id="results" style="display:none">
  <thead>
    <tr><th>Domain</th><th>Linewize</th><th>Site status</th></tr>
  </thead>
  <tbody id="resultsBody"></tbody>
</table>

<script>
const input = document.getElementById("input");
const detected = document.getElementById("detected");
const sendBtn = document.getElementById("sendBtn");
const resultsTable = document.getElementById("results");
const resultsBody = document.getElementById("resultsBody");
const hideBlocked = document.getElementById("hideBlocked");
const hideBroken = document.getElementById("hideBroken");
const summary = document.getElementById("summary");
const CONCURRENCY = 4;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

const URL_REGEX = /((?:https?:\/\/)?(?:[a-z0-9-]+\.)+[a-z]{2,}(?:[\/?#][^\s]*)?)/gi;

function extractDomains(text) {
  const matches = text.match(URL_REGEX) || [];
  const domains = matches.map(m => {
    let d = m.replace(/^https?:\/\//i, "").split(/[\/?#]/)[0];
    return d.toLowerCase();
  });
  return [...new Set(domains)];
}

input.addEventListener("input", () => {
  const domains = extractDomains(input.value);
  detected.textContent = domains.length
    ? `Detected ${domains.length} link${domains.length > 1 ? "s" : ""}: ${domains.join(", ")}`
    : "";
});

sendBtn.addEventListener("click", async () => {
  const domains = extractDomains(input.value);
  if (!domains.length) return;

  sendBtn.disabled = true;
  sendBtn.textContent = "Checking...";
  resultsBody.innerHTML = "";
  resultsTable.style.display = "table";

  // create all rows up front so order stays stable, then check a few at a time
  const jobs = domains.map(domain => {
    const row = document.createElement("tr");
    row.dataset.blocked = "false";
    row.dataset.broken = "false";
    row.innerHTML = `<td>${esc(domain)}</td><td>...</td><td>...</td>`;
    resultsBody.appendChild(row);
    return { domain, row };
  });

  let next = 0;
  async function worker() {
    while (next < jobs.length) {
      const { domain, row } = jobs[next++];
      try {
        const res = await fetch(`/api/check?domain=${encodeURIComponent(domain)}`);
        const data = await res.json();
        const blocked = isBlocked(data.linewize);
        const broken = !!(data.probe && data.probe.broken);
        row.dataset.blocked = blocked;
        row.dataset.broken = broken;
        row.innerHTML = `
          <td>${esc(domain)}</td>
          <td>${formatResult(data.linewize)}</td>
          <td>${formatProbe(data.probe)}</td>
        `;
      } catch (err) {
        // the check request itself failed -> treat as broken/unknown
        row.dataset.broken = "true";
        row.innerHTML = `<td>${esc(domain)}</td><td class="error">error</td><td class="broken">Check failed</td>`;
      }
      applyFilter();
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, jobs.length) }, worker));

  sendBtn.disabled = false;
  sendBtn.textContent = "Send";
});

function isBlocked(result) {
  if (Array.isArray(result)) return !!result[1];
  if (result && typeof result === "object") return !!result.blocked;
  return false;
}

function applyFilter() {
  const rows = resultsBody.querySelectorAll("tr");
  rows.forEach(row => {
    const blocked = row.dataset.blocked === "true";
    const broken = row.dataset.broken === "true";
    row.style.display = ((hideBlocked.checked && blocked) || (hideBroken.checked && broken)) ? "none" : "";
  });
  const total = rows.length;
  const brokenCount = [...rows].filter(r => r.dataset.broken === "true").length;
  const shown = [...rows].filter(r => r.style.display !== "none").length;
  summary.textContent = total ? `Showing ${shown} of ${total} · ${brokenCount} broken` : "";
}

hideBlocked.addEventListener("change", applyFilter);
hideBroken.addEventListener("change", applyFilter);

function formatProbe(p) {
  if (!p) return `<span class="error">unknown</span>`;
  if (p.broken) return `<span class="broken">Broken: ${esc(p.reason)}</span>`;
  if (p.probeFailed) return `<span class="error">${esc(p.reason)}</span>`;
  return `<span class="working">Working</span>`;
}

function formatResult(result) {
  let label, blocked;

  if (Array.isArray(result)) {
    [label, blocked] = result;
  } else if (result && typeof result === "object") {
    label = result.category;
    blocked = result.blocked;
  } else {
    return `<span class="error">${result || "error"}</span>`;
  }

  const cls = blocked ? "blocked" : "allowed";
  return `<span class="${cls}">${label} ${blocked ? "(blocked)" : ""}</span>`;
}
</script>

</body>
</html>
